[package]
name = "hansei-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads a tokio runtime's tasks, futures and threads out of a target's memory"

[features]
# The test-support module (`src/testkit.rs`). It cannot be
# `#[cfg(test)]` — integration tests and hansei's unit tests link the
# library built without that cfg — but nothing on a session's path
# calls it, so it stays out of production builds behind this feature.
# On for: this crate's own test targets (the self dev-dependency
# below) and hansei's tests (its dev-dependency). It turns on proc's
# own `testkit`, for the `Recorder` the doctored-target tests record
# through.
#
# It is also the one way exegesis reaches this crate outside a
# dev-dependency: a fixture read from a fresh core has its bundle
# extracted from build B at test time, by the exegesis under test, and
# testkit is library code that a dev-dependency is invisible to. The
# DWARF stack still never reaches a production build, which is what
# keeping exegesis out of the read side protects.
testkit = ["dep:exegesis", "dep:regex", "dep:tempfile", "dep:testrun", "proc/testkit"]

[dev-dependencies]
blake3.workspace = true
# Only the matrix goldens build a bundle per cell; the crate itself reads
# bundles and never produces one.
exegesis = { workspace = true, features = ["testkit"] }
# The self dev-dependency exists to turn the testkit feature on
# whenever this crate's own test targets build, so no test invocation
# needs a --features flag.
hansei-runtime = { path = ".", features = ["testkit"] }
insta.workspace = true
# The matrix suite holds every review's recorded checksums to the
# sources each cell builds.
md-5.workspace = true
regex.workspace = true
# The version-ceiling notice tests build `Meta.tokio_version` values;
# the non-test code only reads the ones bundles carry.
semver.workspace = true

[dependencies]
aho-corasick.workspace = true
anyhow.workspace = true
foldhash.workspace = true
hansei-bundle.workspace = true
proc.workspace = true
reify.workspace = true
rustc-demangle.workspace = true
# testkit's fixture recipes, output masker, and fresh-core captures.
exegesis = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
testrun = { workspace = true, optional = true }
