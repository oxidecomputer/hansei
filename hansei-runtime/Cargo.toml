[package]
name = "hansei-runtime"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
blake3.workspace = true
# Only the matrix goldens build a bundle per cell; the crate itself reads
# bundles and never produces one.
exegesis.workspace = true
insta.workspace = true
regex.workspace = true
# The version-ceiling notice tests build `Meta.tokio_version` values;
# the non-test code only reads the ones bundles carry.
semver.workspace = true

[dependencies]
anyhow.workspace = true
foldhash.workspace = true
hansei-bundle.workspace = true
proc.workspace = true
reify.workspace = true
# testkit's matrix-manifest reader; testkit is part of the library (see
# its module docs), so these cannot be dev-dependencies.
serde.workspace = true
toml.workspace = true
