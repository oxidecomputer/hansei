[workspace]
resolver = "3"
members = [
    "durin",
    "exegesis",
    "hansei",
    "hansei-types",
    "libproc-sys",
    "proc",
    "reify",
    "test-programs",
    "unwind",
]

[workspace.dependencies]
anyhow = "1.0"
bindgen = { version = "0.72", default-features = false }
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4.5.51", features = ["derive"] }
exegesis = { path = "exegesis", version = "0.1.0", default-features = false }
flate2 = "1.1.5"
# The bundle format stores rust_type_name_hash values (TypeTable::
# by_normalized_name); foldhash makes no cross-version hash stability
# promise, so bumping it requires a bundle FORMAT_VERSION bump.
foldhash = "0.2"
gimli = { version = "0.32", features = ["fallible-iterator"] }
goblin = "0.10.3"
hansei-types = { path = "hansei-types" }
libproc-sys = { path = "libproc-sys", version = "0.1.0" }
memmap2 = "0.9.9"
mimalloc = { version = "*", features = ["v3"] }
object = "0.38"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rayon = "1.12"
proc = { path = "proc", version = "0.1.0" }
reedline = "0.38"
reify = { path = "reify", version = "0.1.0" }
regex = "1.12"
rustc-demangle = "0.1.27"
scroll = "0.13.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
subprocess = "1.0.0"
tempfile = "3.14"
thiserror = "2.0.17"
tokio = "1.47.0"
unwind = { path = "unwind" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
zstd-sys = "2.0"

[profile.release.package.test-programs]
debug = true
