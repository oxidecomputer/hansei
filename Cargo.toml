[workspace]
resolver = "3"
members = [
    "exegesis",
    "hansei",
    "hansei-bundle",
    "hansei-runtime",
    "libproc-sys",
    "proc",
    "reify",
    "testrun",
    "test-programs/genfix",
    "unwind",
]
# A fixture crate, not product code: it owns its Cargo.lock so the
# fixture matrix can pin tokio per cell independently of the workspace
# resolution. Built only through test-programs/regen.sh.
# The demo program is not product code either: its own lockfile, its own
# profiles, built on its own (README, "Trying it out").
exclude = ["example", "test-programs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/oxidecomputer/hansei"

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
bindgen = { version = "0.72", default-features = false }
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
exegesis = { path = "exegesis", version = "0.1.0" }
# The bundle format stores rust_type_name_hash values (TypeTable::
# by_normalized_name); foldhash makes no cross-version hash stability
# promise, so bumping it requires a bundle FORMAT_VERSION bump.
foldhash = "0.2"
gimli = { version = "0.34", features = ["fallible-iterator"] }
goblin = "0.10"
hansei-bundle = { path = "hansei-bundle", version = "0.1.0" }
hansei-runtime = { path = "hansei-runtime" }
insta = "1.48"
libproc-sys = { path = "libproc-sys", version = "0.1.0" }
# Test-only: the matrix suite hashes the sources each review read.
md-5 = "0.11"
memmap2 = "0.9"
mimalloc = { version = "0.1", features = ["v3"] }
object = "0.40"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proc = { path = "proc", version = "0.1.0" }
# Property tests only; the default features pull in a persistence file and a
# fork/timeout harness neither of which any test here wants.
proptest = { version = "1.11", default-features = false, features = ["std"] }
rayon = "1.12"
reedline = "0.51"
reify = { path = "reify", version = "0.1.0" }
regex = "1.12"
rustc-demangle = "0.1"
scroll = "0.13"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
subprocess = "1.2"
tempfile = "3.27"
terminal_size = "0.4"
# Test scaffolding, dev-dependency only: see testrun/src/lib.rs.
testrun = { path = "testrun", version = "0.1.0" }
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unwind = { path = "unwind" }
zstd = "0.13"
zstd-sys = "2.0"

# Dependencies build optimized, with line tables only, in the test
# profile. The suites spend most of their time in other people's code
# (blake3 checking every bundle it loads, gimli and object parsing the
# fixtures' DWARF, the runtime hansei spawns), which unoptimized is
# several times slower; a dependency compiles once, never per edit.
# Workspace crates keep full debug info: exegesis's unit tests read
# their own binary's DWARF.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# CI's test builds: the dev profile with line tables only for the
# workspace crates too. Full debug info is most of every test binary,
# and there are a few dozen test binaries, each linking the workspace;
# CI runs out of disk long before it needs a debugger. exegesis and
# hansei keep full debug info, since their tests read their own
# binary's DWARF.
#
# exegesis and hansei-bundle, which write every bundle, are optimized:
# a Linux run extracts some ninety bundles before its suite starts. CI
# compiles the workspace crates afresh every run, so optimizing any
# more of them costs more compile time than the tests win back.
# Measured on four CPUs, build, fixtures and suite take 176 s with
# these two optimized, 195 s with none, and 220 s with every crate.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.ci.package.exegesis]
opt-level = 1
debug = "full"

[profile.ci.package.hansei-bundle]
opt-level = 1

[profile.ci.package.hansei]
debug = "full"
