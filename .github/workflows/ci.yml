#
# The merge gate. Every Linux and illumos run builds the fixture
# programs, cores them, and checks the cores against the committed
# goldens. The linux job also reads the illumos set, through the same
# production readers, against the same goldens: a core read away from
# the system that took it, as one is whenever an illumos core is
# copied to a laptop. Three checks:
#
#   lint     rustfmt over both manifests, clippy
#   linux    the whole suite in the pinned image (.github/image/),
#            capturing the linux and linux-floor sets and reading the
#            illumos set beside them
#   helios   the whole suite on illumos, capturing the illumos set
#            (buildomat: .github/buildomat/jobs/helios.sh)
#
# The linux job tests a pull request's head commit, not the merge
# commit Actions checks out by default: buildomat builds the head and
# publishes the illumos cores under it, and a set is read only by the
# tree it was captured from.
#
# The version matrix is not among them: it is dispatched by hand
# (matrix.yml).
#
# The suites build with the ci profile (Cargo.toml), which keeps line
# tables only for most workspace crates: debug info is most of every
# test binary, and a runner has disk for little else.
#
# A golden read from cores is blessed only by the host that captures
# its set; a diff only the linux job's read of the illumos set shows
# is a reader bug, and one a host and this workflow disagree on is a
# canonicalization gap.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The fixture work each job does before its suite (build_fixtures)
  # counts as the suite's own only under one run name; a rerun is a
  # new one.
  HANSEI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # The commit the jobs that read cores test (see the header).
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Its own job, so a lint failure does not stop the suite from running.
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The linux job's toolchain, restored but never saved from here:
      # the cache budget has no room for a copy of its own.
      - uses: ./.github/actions/linux-image
        with:
          cache: linux
          save: "false"

      - name: Format
        run: |
          .github/scripts/in-image.sh cargo fmt --all --check
          .github/scripts/in-image.sh cargo fmt --manifest-path test-programs/Cargo.toml --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: .github/scripts/in-image.sh cargo clippy --locked --workspace --all-targets -- -D warnings

  linux:
    name: linux
    runs-on: ubuntu-26.04
    # The wait for helios below lasts as long as buildomat does.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}

      - id: image
        uses: ./.github/actions/linux-image
        with:
          cache: linux

      # The workspace's and the fixture programs' dependency builds.
      - uses: ./.github/actions/linux-rust-cache
        with:
          image: ${{ steps.image.outputs.image }}

      - name: Fixture toolchain
        run: .github/scripts/in-image.sh .github/scripts/fixture-toolchain.sh

      # The suite's build builds the fixture example with it. `cargo run
      # -p hansei-runtime --example` would resolve features for that
      # one package and compile the workspace a second time.
      - name: Build
        run: .github/scripts/in-image.sh cargo nextest run --workspace --locked --no-run --cargo-profile ci

      # Outside the suite, so no test waits on it under the per-test
      # limit (.config/nextest.toml) or holds a slot while it does.
      - name: Fixtures
        run: .github/scripts/in-image.sh target/ci/examples/build_fixtures

      # The illumos set, unpacked beside this job's own: a capturing
      # system reads every set it finds there (testkit::cores::sets).
      # Waited for only now, so that buildomat's run overlaps this
      # job's build and captures. A helios job that delivers nothing
      # leaves this job's own sets read, and fails it by name after.
      - id: helios
        name: Wait for helios
        continue-on-error: true
        run: .github/scripts/wait-helios.sh "$HEAD_SHA" "$HANSEI_CORES"

      # Again, now that it is there: the illumos set's bundles.
      - name: Fixtures (illumos)
        if: steps.helios.outcome == 'success'
        run: .github/scripts/in-image.sh target/ci/examples/build_fixtures

      - name: Test
        run: .github/scripts/in-image.sh cargo nextest run --workspace --locked --no-fail-fast --profile ci --cargo-profile ci

      - name: Illumos set read?
        if: ${{ !cancelled() && steps.helios.outcome == 'failure' }}
        run: |
          echo "::error::helios delivered no cores, so the illumos set went unread; see its check"
          exit 1

      - name: Disk
        if: always()
        run: df -h / "${{ steps.image.outputs.scratch }}"

      # Whatever was captured, pass or fail: a failure here is
      # root-caused from it, and a Mac reads it with `gh run download`.
      # A Linux core is mostly holes, which --sparse keeps out of the
      # archive and the reader's disk alike. The dot-named bookkeeping
      # is this host's own.
      - id: cores
        name: Archive cores
        if: always()
        run: |
          sets=()
          for set in linux linux-floor; do
            [ -d "$HANSEI_CORES/$set" ] && sets+=("$set")
          done
          if [ ${#sets[@]} -eq 0 ]; then
            echo "no cores were captured"
            exit 0
          fi
          tar --sparse --exclude='.*' -C "$HANSEI_CORES" -cf - "${sets[@]}" \
            | zstd -3 -T0 -q -o "$RUNNER_TEMP/cores-linux.tar.zst"
          ls -l "$RUNNER_TEMP/cores-linux.tar.zst"
          echo "archived=true" >>"$GITHUB_OUTPUT"

      - if: always() && steps.cores.outputs.archived == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cores-linux
          path: ${{ runner.temp }}/cores-linux.tar.zst
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
