# cargo-mutants: what a test suite is asked to prove.
#
# The suites here assert over frozen captures, so nearly every test
# executes the same lines; what varies is which *behaviour* is pinned.
# Mutation testing is the tool that tells those apart — it reports the
# code that can be changed without any test noticing.
#
# Every run goes in the Linux test image, whose rendering the suites'
# goldens are (see CLAUDE.md). The loop for a change is the diff:
#
#     git diff origin/main > mutants.diff
#     HANSEI_REUSE_FIXTURES=1 .github/scripts/in-image.sh \
#         cargo mutants --in-diff mutants.diff
#
# and a sweep of one crate is `cargo mutants -p hansei-runtime`: about
# twenty seconds a mutant at -j 6 on a 32-core host (3,831 mutants, so
# most of a day), measured 2026-10-03. See https://mutants.rs/.
#
# Set HANSEI_REUSE_FIXTURES for any sweep. A sweep is one nextest run
# per mutant over one scratch copy of the tree per job, so without it
# every mutant rebuilds the fixture programs and re-extracts every
# bundle that the last one left sitting there. It is what makes a sweep
# on a host where the acceptance suite runs affordable (5 s a run
# against 20 s); see testrun/src/lib.rs for what the digest covers.

test_tool = "nextest"

# Stop a mutant's test run at its first failure, and kill whatever is
# still running rather than wait for it. One failure is the verdict;
# without this a caught mutant waited minutes for the slowest
# acceptance test still in flight, which was most of a sweep's time.
#
# Run the tests that catch mutants first: nextest's `mutants` profile
# (.config/nextest.toml) orders the suite so a mutant's verdict does
# not wait behind work that could not have produced it.
#
# Arguments after a command line's `--` are appended to these, not put
# in their place, and nextest refuses a flag given twice: pass neither
# again there, or the unmutated baseline fails before any mutant runs.
additional_cargo_test_args = ["--max-fail=1:immediate", "--profile", "mutants"]

# Build with CI's cargo profile: line tables only, except for the two
# crates whose tests read their own binary's DWARF (see Cargo.toml).
# No suite reads the rest of the debug info, and leaving it out takes
# about a tenth off a mutant's rebuild. That is a small share of a
# sweep: under a sweep's load a rebuild's time is mostly waiting on
# the other jobs' test runs for CPU.
profile = "ci"

# Copy only what git tracks. cargo-mutants copies the tree into a
# scratch dir per job, and does *not* filter by gitignore unless told
# to: on a host that has built the version matrix, that means 12 GB of
# fixture binaries and target dirs per job, which exhausts a /tmp quota
# several jobs in. Skipping them costs nothing — a job builds the
# fixtures it needs once, and reuses them across its mutants when
# HANSEI_REUSE_FIXTURES is set. Large *untracked* files in the checkout
# are still copied; keep debug binaries and cores outside the tree.
gitignore = true

# The first test run in a fresh scratch dir builds the fixture programs
# (nothing was copied, per the setting above), and that build happens
# inside the *test* phase — so the auto-set timeout, derived from a
# baseline that found them already built, cuts it off and reports a
# timeout where there is no hang. Floor it above a cold fixture build:
# a real hang is a mutated loop, which trips this in seconds either
# way. The floor is set above the whole judging suite run cold in a
# fresh scratch copy — the fixture build, then every extraction and
# the acceptance captures — which passed 300 s once the fixtures
# linked a crate at two releases: the mutant that pays it is reported
# as a timeout, which counts as caught, and that is a false verdict.
minimum_test_timeout = 600

# Which crates' tests judge a mutant. The default — the mutated crate's
# own tests — is wrong here: hansei-runtime is a library its consumers
# assert, so `FutureCensus::locate`, the render helpers and the listing
# rows are exercised from hansei and read as untested on their own.
#
# exegesis is in the list because it is the only thing that *writes* a
# bundle. Judged without it, half of hansei-bundle reads as untested:
# the interner can return a name nobody asked for, a selector builder
# can return `Default::default()`, and every read-side test still
# passes because none of them build anything. It was left out while a
# sweep meant a fixture build per mutant; HANSEI_REUSE_FIXTURES ended
# that, and a measured sweep with it in scope costs about what one
# without it did.
#
# This list judges a mutant anywhere in the workspace. A sweep whose
# mutants all sit in known crates can narrow it on the command line
# (`--test-package`, which replaces the list) to those crates and every
# workspace crate depending on them, through any kind of dependency: no
# other suite links the mutated code, and none runs a binary built from
# it, so nothing is lost but the time those suites take.
test_package = [
    "hansei-bundle",
    "reify",
    "proc",
    "unwind",
    "hansei-runtime",
    "hansei",
    "exegesis",
    # testrun's recipe and digest logic is asserted by its own unit
    # tests (the two-binary receipt check only sees the rendered
    # record); left out, a recipe field the target build drops reads
    # as untested.
    "testrun",
]

exclude_globs = [
    # Fixture programs and the dashboard's TypeScript build.
    "test-programs/**",
    # Non-primary tokio version families. A family's detectors run only
    # when the target's tokio version selects it, which the default fixture
    # build never does — their judge is the opt-in version matrix, whose
    # goldens pin which family attached per cell (formats.snap), every
    # attached format's member chains, and which walk spelling bound. A
    # sweep's suite never selects these modules, so every mutant in them
    # reads as missed. The primary family's module (today tokio_v1_49.rs)
    # stays swept because the extraction goldens judge it; when the primary
    # pin advances, move the newly-primary module out of this list and the
    # newly-non-primary one in.
    "exegesis/src/detect/tokio_v1_47.rs",
    "exegesis/src/detect/tokio_v1_52_0.rs",
    "exegesis/src/detect/tokio_v1_53.rs",
]

exclude_re = [
    # The waker sweep's run enumeration: with `<=` a run that ends
    # exactly at a mapping's edge is kept as a zero-length chunk, which
    # a read of nothing then drops. Nothing observable.
    "replace < with <= in Context<'b, T>::readable_runs",
    # `aligned_matches`: with `<=` the loop's last step searches an
    # empty tail and finds nothing. Nothing observable.
    "replace < with <= in aligned_matches",
    # `held_spans` keeps a find of nonzero size; the census never lists
    # a zero-sized one (its scan skips them), so `>=` admits the same.
    "replace > with >= in held_spans",
    # The attributor's chain roots skip a zero-sized frame the same
    # way; with `>=` the frame is read as an empty value, which
    # contains no address and so files nothing. Nothing observable.
    "replace > with >= in Attributor<'a, 'b, T>::chain_roots_of",
    # A throughput knob, not behavior: the worker count only decides how
    # the parse fan-out is scheduled, and collection is order-independent
    # by design (references are global offsets, dedup is deferred), so
    # every spelling folds to the same DwReader. A count of 0 is "pick a
    # default" to the pool builder.
    "replace default_parallelism",
    # The same knob one layer down: whether a partition or a placement
    # runs inline or on the pool only routes the work, and both paths
    # produce the same result (each id is in exactly one independent
    # group).
    "inline_groups",
    # A tracing count: how many groups a pass changed is logged beside
    # the pass number, and no test reads the log. The pass and group
    # counters the summary prints are pinned by the identity tests.
    "replace \\+= with [*-]= in Fixpoint<'r, 'dw>::cascade",
    # A tracing predicate: the count of declarations no unit evidence
    # places is warned about, and no test reads the log; the count
    # itself, and each declaration, are pinned through the report.
    "delete ! in DwReader<'dw>::report_identity",
    # Equivalent mutant: the early exit once a declaration's siblings
    # vote for two classes is a shortcut — the votes are counted after
    # the loop, and two of them are ambiguity either way.
    "replace > with < in DwReader<'dw>::place_declarations",
    # Equivalent mutant: skipping a duplicate's references when building
    # a group's dependencies only trims work — walking them too adds
    # referrers, and a referrer repartitioned once more settles to the
    # same classes (the worklist test pins the result against a
    # whole-pass reference).
    "replace \\|\\| with && in DwReader<'dw>::group_dependencies",
    # Equivalent mutant: handing a one-class group to the placement too
    # only adds work — a group with fewer than two classes places
    # nothing, and the placement screens it out itself.
    "replace > with >= in DwReader<'dw>::settle_named",
    # And the subprogram sweep's copy of it: the chunked parallel path
    # merges per-worker sweeps in chunk order, which resolves the
    # "first wins" fields exactly as the serial loop does.
    "replace < with [<=>]+ in sweep_functions",
    # And the vtable name index's: the per-shard maps merge into one
    # name-keyed index, and each hint's candidates collapse through a
    # BTreeSet, so shard order cannot reach the answer.
    "replace < with [<=>]+ in resolve_vtable_type_hints",
    # Equivalent mutant: the arm deleted falls through to a `_` arm doing
    # the same nothing. It is there to say arrays carry no descriptive
    # fields to inherit, not to change behavior.
    "delete match arm \\(RawType::Array\\(_\\), RawType::Array\\(_\\)\\) in DwReader<'dw>::inherit_type_identity",
    # A tracing predicate: the conjunction only decides whether a debug
    # line is logged for a nameless type, and no test reads the log.
    "replace && with \\|\\| in CodegenUnit<'dw>::add_type",
    # Equivalent mutants: the arm deleted falls through to a `_` arm
    # returning the same thing, so nothing can tell the difference. The
    # arm is there to say *why* a union is stopped at.
    "delete match arm TypeClass::Union in scan_plan",
    # Equivalent mutant: past the `get` miss above it (which is where a
    # symbol the target lacks returns None), `candidates` is an index
    # entry, and entries are only created by the build loop's
    # `entry(key).or_default().push(symbol)` — creation and push are one
    # statement, so every entry holds at least one symbol and `by_addr`
    # is never empty. The arm stays as the graceful answer should a
    # refactor of the index build ever make an empty entry possible.
    "delete match arm 0 in Context<'b, T>::object_symbol",
    # Equivalent mutant: the boundary loop is the fast half of a check
    # the per-string `get` sweep below it repeats. A decreasing end
    # inverts its own string's range and an out-of-bounds end overruns
    # `data`; either way that string's `get` answers None and the sweep
    # returns false. Weakening the join only changes which half rejects
    # a corrupt table, never the answer.
    "replace \\|\\| with && in StringTable::is_well_formed",
    # Equivalent mutant: a frame member's absolute address is threaded
    # into the fd join's candidate value for completeness, but the
    # resource walks consume only its bytes — the ScheduledIo address
    # comes from the Arc's pointer after a Deref, the fd from
    # byte-sliced newtypes — so skewing the candidate's own address is
    # unobservable. The regex necessarily covers the slice-end sum a
    # few lines up too; the io fd join tests kill both of its
    # spellings (confirmed by running them), so skipping their report
    # costs nothing. If a resource walk ever needs the member's own
    # address, delete this entry and pin the arithmetic instead.
    "replace \\+ with [*-] in Context<'b, T>::resource_member",
    # The engine slices a coroutine's variant payload at the state's
    # address plus the payload's offset, which rustc lays at zero for
    # every coroutine state (the discriminant sits among the members):
    # no fixture, and no reviewed program, reaches a payload past
    # offset zero, so subtracting it reads the same bytes. The `*`
    # mutant on the same expression is caught (address times zero).
    "chain.rs.*replace \\+ with - in Context<'b, T>::continuation",
    # A defensive filter on impossible input: task_extent only ever
    # returns start..start+size with a nonzero size (a Cell's size or
    # trailer_offset + trailer size), so no extent is empty and the
    # degenerate-span guard never distinguishes. Weakened to >=, an
    # empty span could enter the index — but nothing can produce one.
    "replace > with >= in Context<'b, T>::task_extents",
    # A constant type-name hash is a performance bug, not a behaviour
    # one, and no test can see it: the index groups candidates by this
    # hash and `rust_type_names_equal` still decides each one, so every
    # name colliding costs a comparison rather than a wrong answer.
    # Both sides of a lookup use the same function, so a sweep cannot
    # reach the thing that would really break — a hash that changes
    # between the bundle and the reader, which is what the
    # FORMAT_VERSION bump on foldhash is for.
    "replace rust_type_name_hash",
    # Two lines of stderr glue on a Session, which only a live attach
    # constructs — no automated test drives one. Everything the
    # method does is pinned one
    # call in: the once-per-session guard and the warning line in
    # version_ceiling_line's tests, the drift predicate and wording in
    # hansei-runtime's version_ceiling_notice tests.
    "replace Session<'b, T>::note_version_ceiling",
    # A println loop over `outcomes` (whose list the corpus coverage
    # test pins). Its output is for the soak scripts' coverage
    # parsers, which run on a capture host, not in any sweep's judging
    # suite. It is judged one step removed, by the soak loops'
    # coverage summaries.
    "replace print_outcomes",
    # Equivalent mutant: each byte is shifted onto its own zeroed lane of
    # the accumulator, so the operands never share a set bit and or, xor
    # (and add) agree on every input. `|` is the spelling that says
    # "assemble disjoint lanes".
    "replace \\| with \\^ in u128_from_le",
    # The same disjoint-lanes argument in the string table's id encoding:
    # the shard fills the low bits, the local index is shifted past them.
    "replace \\| with \\^ in encode",
    # A constant shard is a distribution bug, not a behaviour one — the
    # same function maps a string on both the write and the read side, so
    # every string landing in one shard costs contention, never a wrong
    # answer. The same shape as rust_type_name_hash above.
    "replace shard_of",
    # Equivalent mutants, the same disjoint-lanes argument: TaskState's
    # STATE_MASK is assembled from single-bit constants no two of which
    # share a bit, so or and xor agree on every pair. The anchor keeps
    # the file's *function* or-mutants (which carry an "in fn" suffix)
    # reported.
    "tokio/mod.rs.*replace \\| with \\^$",
    # Equivalent mutant: `visited` is only consumed alongside `proc` —
    # the pointer arms demand the `(ctx.proc, ctx.visited)` pair and the
    # parallel gates read it after a read `proc` already served — and the
    # same struct literal nulls `proc` (which has its own pin: the
    # non-following-alias test that a `&str` target is never read), so
    # whether `visited` was also nulled can never be observed. Note the
    # tool does not currently apply name filters to delete-field mutants,
    # so this entry documents the triage more than it trims the run.
    "delete field visited from struct RenderCtx expression in eval_node",
    # Equivalent, and deliberately left without an entry: deleting
    # `unsent: None` from the negotiating arm of hansei's `conn_row`
    # leaves the `..base` row's own `None`. An entry would name the HTTP
    # arm's `unsent` too — the same mutant name, and a real one, pinned
    # by the HTTP-over-TLS row test — should the tool ever filter
    # delete-field mutants by name.
    # Equivalent mutant: a member's target address is threaded into every
    # child for the node vocabulary's benefit, but no node consumes a
    # child's own address terminally today — every target read goes
    # through pointer words in the bytes — so scaling the address is
    # unobservable. (The sibling wrapping-sub spelling dies on the debug
    # overflow check.) If a node kind that reads at a value's own address
    # ever lands, delete this entry and pin the arithmetic instead.
    "replace \\+ with \\* in eval_struct",
    # Equivalent mutant: a named pointer's arm answers ty.name(), and
    # so does the `_` arm the deletion falls through to — the arm is
    # there to say a named pointer keeps its name rather than being
    # respelled from its pointee. (The name:None arm is not equivalent
    # and stays reported; this matches only the Some spelling.)
    "delete match arm TypeDef::Pointer\\{name:Some",
    # Write batching, not behavior: CHUNK and BIG only decide how the
    # renderer's pieces coalesce into sink writes, and every spelling
    # of these mutants flushes the same bytes in the same order. The
    # shifted constants and the re-aimed comparisons cost copies, not
    # output.
    "replace << with >> in print_variable",
    "replace >= with < in print_variable::Stream",
    # The best-effort hint on a refused attach: the guard re-attaches
    # under the laxer policy to check the hint would be true, and only
    # a core/bundle pair whose non-essential walk paths are broken can
    # reach it. No automated test constructs one — the same gap as
    # note_version_ceiling above, judged by a human against a broken
    # target rather than by any sweep's suite.
    "match guard !args\\.best_effort",
    "replace && with \\|\\| in Session<'b, T>::attach",
    "delete ! in Session<'b, T>::attach",
    # Two lines of stderr glue: the spelling is pinned one call in
    # (warning_lines), and which stream it goes to is not something a
    # captured-stdout test can see — the same gap as
    # note_version_ceiling above.
    "replace print_warnings",
    # The same stderr glue over the census: the per-find errors and the
    # capped/refused notices `futures` opens with all go to stderr, and
    # each spelling is pinned one call in (warning_lines, the
    # census_warning_tests) — a captured-stdout test cannot see whether
    # the call happened, the same gap as print_warnings above.
    "replace print_census_warnings",
    # The same stderr glue once more, for the census's uncertain-locals
    # notice: its sentence is pinned one call in
    # (census_uncertain_warning, in census_warning_tests), and the
    # census's own count of uncertain locals is pinned per fixture in
    # hansei-runtime's two_binary suite.
    "replace warn_census_uncertain",
    # A frame's positional locals are keyed by (name, offset), mirroring
    # the locals display, so a member listed twice is sliced once. No
    # bundle lists one twice — a struct's members are unique by name
    # and offset — so the guard never declines, and a mutant that
    # skips it is indistinguishable on every fixture.
    "replace && with \\|\\| in Walker<'_, 'b, T>::frame_locals",
    # The interactive REPL loop wants a terminal on stdin, which no
    # automated test has: every scripted path through the same dispatch
    # is exercised through stdin scripts, and what this adds — reedline,
    # the prompt, ctrl-c/ctrl-d handling — only a person can drive.
    "replace interactive ",
    # The editor's half of that loop: it owns reedline and the terminal,
    # and the session's half is what a test can drive — the value
    # requests it answers are pinned over a fixture pair in repl.rs.
    "replace edit_loop",
    # A 32-bit guard, unobservable anywhere this suite runs. On 64-bit
    # every recorded frame size converts, so the guard is always true;
    # forcing it false only routes the decode through the reallocating
    # path, which returns the same bytes. What it protects against — a
    # size that does not fit a 32-bit usize, where `size as usize`
    # would truncate — cannot be built on the hosts that test this.
    "replace match guard usize::try_from",
    # Equivalent mutant: the loop's `<=` spelling only admits one extra
    # probe at off == size, whose max is size - size = 0 — and a probe
    # answers at most max, so it answers 0, the hole step runs once
    # more, and the loop ends with the same runs either way. A probe
    # answering more than its max is outside readable_len's contract.
    "replace < with <= in readable_runs",
    # Equivalent mutant: the body of HeapGate::none *is*
    # `HeapGate::default()`, so the replacement is the function. It is
    # spelled as its own constructor to say "no allocator to ask" at
    # the call sites, which is a different claim from "the default".
    "replace HeapGate<'h>::none",
    # The launch warm-up is transparent by design: every accessor whose
    # state it builds falls back to computing the same state in place
    # when nothing was adopted, and the listing rows are built on first
    # use by the same cells, so the worker answering None, the adoption
    # or the whole warm-up replaced with () changes only when the work
    # runs, never any answer. The state itself — the census, the task
    # extents, the rows — is what the rest of the suites pin. The
    # allocator evidence discovery gates on is built by the attach and
    # only borrowed here, so the worker still builds nothing a later
    # answer depends on.
    "replace warm_worker ",
    "replace warm_listings with \\(\\)",
    "replace Session<'b, T>::adopt with \\(\\)",
    # A throughput knob and a thread name, the same shape as
    # default_parallelism above: skipping the global pool build entirely
    # leaves rayon to install its own on first use, so every fan-out
    # still runs and every answer is the same. What the call decides —
    # how many workers a session is polite enough to take, and what
    # `pstack` calls them — no test can observe, and the session cap is
    # a judgment about rack sleds that no host here has.
    "replace build_pool with \\(\\)",
    # Equivalent mutant in the snapshot-corrupting test double: admitting
    # the address exactly at a run's end matches a run with no bytes left
    # past it, which no read of any length serves and whose readable
    # length is zero either way. The strict bound says what a run's end
    # means; nothing can tell the two apart.
    "replace < with <= in Corrupt<'a>::segment",
    # Equivalent mutant: the watch scan's two tests only save reads.
    # Weakened to `&&`, a pointee of another type is read and put to
    # the watch walk, which is rooted at `ArcInner<watch::Shared>` and
    # declines it; a second pointer to the same `Shared` reads it again
    # and answers what the first did. No row changes.
    "replace \\|\\| with && in Attributor<'a, 'b, T>::watch_of",
    # A defensive guard on impossible input: a root is a task frame, a
    # find or a set child, each a coroutine or a future with a
    # discriminant, so no root type is zero-sized and the guard never
    # declines. Weakened to `>=`, a zero-sized root would be read as
    # nothing and hold no slot — the same answer as being skipped.
    "replace > with >= in Attributor<'a, 'b, T>::roots_of",
    # Equivalent mutants: the offset walk skips zero-sized members
    # (a struct's, a union's `value`, a coroutine state's locals)
    # before asking whether one holds the offset. Admitting size 0
    # picks a member spanning no offset at all, which the bounds check
    # beside it rejects, so the walk answers the same either way. The
    # guard is there to say why a `PhantomData` at the offset is not
    # the slot.
    "replace > with >= in Attributor<'a, 'b, T>::descend",
    "replace > with >= in Attributor<'a, 'b, T>::local_liveness",
    # Equivalent mutants: the end bound of a union's `value` and of an
    # enum's active payload. One past the end enters the member's own
    # walk at an offset equal to its size, where no member and no
    # terminal is, and that walk answers not-a-waker as the bound
    # does. (The struct arm's end bound is not equivalent — a member
    # ending where the next begins would be entered first — and the
    # `Holder { a, w }` walk kills it; the two patterns cover it too.)
    "replace < with <= in Attributor<'a, 'b, T>::descend",
    "replace >= with > in Attributor<'a, 'b, T>::descend",
    # The pointer sweep's depth counter only caps a recursion the type
    # tree already bounds: a value's members are strictly smaller than
    # it, so the walk ends on its own, and the cap (MAX_DEPTH, 24)
    # exists to bound the work on a pathological nest. Miscounting the
    # depth changes nothing a nest shallower than the cap can show,
    # and no fixture nests a value that deep.
    "replace \\+ with \\* in Attributor<'a, 'b, T>::collect_pointers",
    # The watch enrichment's mapped-address guard on its receiver
    # route. Inverted, the route skips the mapped `Shared` pointer and
    # follows only unmapped ones, whose read fails — and on every
    # fixture the `changed_impl` route below it reaches the same
    # `Shared`, so no answer moves. The target that would tell them
    # apart holds a `watch::Receiver` with no `changed_impl` frame
    # under it (a `changed` wrapped in `Coop`); pin it there when a
    # fixture has one.
    "delete ! in Context<'b, T>::watch_target",
    # Equivalent mutants: a text's routes (a request's target, a pool's
    # key) each running one step only cannot pass the checks above
    # them. A one-step pointer route makes its member the byte pointer
    # itself, and a route into that member reaches a byte, never the
    # unsigned word a length must be; a one-step length route makes its
    # member the word, which has no member for the pointer's route to
    # take. (`&&` → `||` there is pinned by the two-holder case in the
    # request binding's test.)
    "replace > with >= in Check<'a>::text",
    # Equivalent mutant: `may_hold_request` is a memoized pre-screen.
    # The frame's locals it spares are the same members and variant
    # members it checks, and each is screened by `keeps_request` again,
    # so admitting every frame finds exactly the same request.
    "replace Context<'b, T>::may_hold_request -> bool with true",
    # Equivalent mutants: the inertness walk's memo only saves walks.
    # Never consulted, or never filled, every question is answered by
    # a walk of its own, which its visited set bounds and which reaches
    # the answer the memo would have held.
    "replace Memo<K, V>::get -> Option<V> with None",
    "replace Memo<K, V>::insert with \\(\\)",
    # Equivalent mutant: the `Pending` screen's name test is a
    # pre-screen that saves the walk, the same shape as the adapter
    # branch above it — `core_pending` itself checks the declaring
    # module and the name prefix, so admitting every type to the screen
    # binds exactly the same set. (The function's other `&&` are
    # let-chains, which the tool does not mutate.)
    "replace && with \\|\\| in collect_semantic_seeds",
    # A defensive counter on impossible input: a `select!` branch's
    # route is one named member step into the tuple value already in
    # hand, and the validator resolves that name against the tuple
    # type before the bundle is accepted, so the route cannot fail and
    # `unread` is never incremented on a validated bundle. The counter
    # is kept because the executor's answer is a Result and a verdict
    # over the branches must decline if it ever is an error — that is
    # pinned where it is consulted (`never_ready`, unread > 0) — but no
    # target can reach the increment itself.
    "replace \\+= with [*-]= in Context<'b, T>::select_branches",
    # A count of the types whose own crate's declarations name two
    # packages, which the label pass declines rather than choose
    # between. No fixture and no reviewed target has one (nexus and
    # sled-agent both count zero), so no suite can see the count
    # skewed; the summary line it feeds is what would say so.
    "replace \\+= with [*-]= in crate_labels",
    # Equivalent mutant: `StopNames::name` is a memo, not an answer.
    # A member's type id and its recorded type name come from the same
    # `view.ty(..)` — the runtime fills one in only where the other is
    # there — so a `None` here falls through to `spell(member.future)`,
    # which is the very string `name` would have memoized. The type-id
    # route exists to fold a name once per type rather than once per
    # member.
    "replace StopNames<'a>::name -> Option<String> with None",
    # Equivalent mutant: the header-read timeout's nanoseconds word is
    # read only through the `Option`'s `Some`, and a billion is the
    # niche that `None` is stored as, so `<` and `<=` pass the same
    # words.
    "replace < with <= in Context<'b, T>::observe_http_conn",
    # The pool reaper's screens on std's own layout: the pool's mutex
    # is a `std::sync` `Mutex`, and the idle list's words are a byte
    # pointer and an unsigned word. Every std in the reviewed range
    # meets both halves of each, so weakening either to `||` passes
    # the same types; the steps after each (the mutex's `UnsafeCell`,
    # the validator's pointer and word checks) hold the rest of the
    # layout either way.
    "replace && with \\|\\| in hyper_util_pool_reaper",
    # Equivalent mutant: the crate-hash pairing's symbol pre-filter.
    # It skips a symbol that is not v0 or names no evidence crate
    # before demangling it; with `&&` more symbols are demangled, and
    # each is then kept only for the crate hashes it names and the drop
    # glue whose type is an evidence entry — which a skipped symbol has
    # neither of. The filter is a cost, not an answer.
    "replace \\|\\| with && in Evidence<'a>::glue",
    # Equivalent mutant: the sole-release fallback's filter. With `||`
    # a type its own declarations already labeled takes the fallback
    # too, but a crate root has a sole release only where the binary
    # links one release of one package naming it — the label those
    # declarations gave — and a declined type's root names two
    # packages, so has none.
    "replace && with \\|\\| in declared_releases",
    # Equivalent mutant: the stream-route walk's cycle bound. A route
    # that ends at a socket enters each record at most once, so its
    # hops never reach the record count, and a cycle that `<` stops
    # at the count `<=` stops one hop later, with the same error.
    "replace < with <= in io_routes_end_at_sockets::ends",
    # Equivalent mutant: the runtime's own route bound. Validation has
    # proved every route ends at a socket well inside it, so a route
    # read from a validated bundle never comes near the bound; it only
    # stops a table that was never validated.
    "replace < with <= in Context<'b, T>::follow_io_route",
    # No fixture can reach it: a peer is bound only on sprockets' TLS
    # stream, a git-only crate no test program links, and nothing else
    # names its peer as bytes in the stream. The reading is pinned by
    # the r23 sled-agent cores, whose trust-quorum rows print each
    # peer's platform id; the binding's planning and validation have
    # unit tests of their own.
    "replace Context<'b, T>::observe_peer -> Result<String, String> with Ok",
    # The shared capture: building, parking and coring every fixture
    # program into HANSEI_CORES, once per run. Under
    # HANSEI_REUSE_FIXTURES it is stamped by the capture record, which
    # reads only the fixture sources (a test in the same file pins
    # that), so the baseline takes the cores and no mutant runs this
    # again: every mutant here would read as missed. The stability gate
    # and every run over fresh cores exercise it instead. `Parked`,
    # `gcore` and `binary_args` stay swept: acceptance cores a fresh
    # process with them in every test.
    "testkit/cores\\.rs:.*: replace (take|take_one|sysroot|place) with \\(\\)",
    "testkit/cores\\.rs:.* in sysroot$",
    # The same capture taken on demand for the genfix soak, whose
    # oracle runs only when the soak loop asks for it: no sweep reaches
    # it. The soak itself is its judge.
    "testkit/cores\\.rs:.*: replace capture_now ",
]
