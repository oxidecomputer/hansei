# cargo-mutants: what a test suite is asked to prove.
#
# The suites here assert over frozen captures, so nearly every test
# executes the same lines; what varies is which *behaviour* is pinned.
# Mutation testing is the tool that tells those apart — it reports the
# code that can be changed without any test noticing.
#
# The loop for a change is the diff:
#
#     git diff origin/main > /tmp/change.diff
#     cargo mutants --in-diff /tmp/change.diff
#
# and a sweep of one crate is `cargo mutants -p hansei-runtime` (~25
# minutes). See https://mutants.rs/.
#
# Set HANSEI_REUSE_FIXTURES for any sweep. A sweep is one nextest run
# per mutant over one scratch copy of the tree per job, so without it
# every mutant rebuilds the fixture programs and re-extracts every
# bundle that the last one left sitting there. It is what makes a sweep
# on a host where the acceptance suite runs affordable (5 s a run
# against 20 s); see testrun/src/lib.rs for what the digest covers.

test_tool = "nextest"

# Copy only what git tracks. cargo-mutants copies the tree into a
# scratch dir per job, and does *not* filter by gitignore unless told
# to: on a host that has built the version matrix, that means 12 GB of
# fixture binaries and target dirs per job, which exhausts a /tmp quota
# several jobs in. Skipping them costs nothing — a job builds the
# fixtures it needs once, and reuses them across its mutants when
# HANSEI_REUSE_FIXTURES is set. Large *untracked* files in the checkout
# are still copied; keep debug binaries and cores outside the tree.
gitignore = true

# Which crates' tests judge a mutant. The default — the mutated crate's
# own tests — is wrong here: hansei-runtime is a library its consumers
# assert, so `FutureCensus::locate`, the render helpers and the listing
# rows are exercised from hansei and read as untested on their own.
#
# exegesis is in the list because it is the only thing that *writes* a
# bundle. Judged without it, half of hansei-bundle reads as untested:
# the interner can return a name nobody asked for, a selector builder
# can return `Default::default()`, and every read-side test still
# passes because none of them build anything. It was left out while a
# sweep meant a fixture build per mutant; HANSEI_REUSE_FIXTURES ended
# that, and a measured sweep with it in scope costs about what one
# without it did.
test_package = [
    "hansei-bundle",
    "reify",
    "proc",
    "hansei-runtime",
    "hansei",
    "exegesis",
]

exclude_globs = [
    # Not mutated, only asked to judge: its goldens rebuild every
    # fixture program, and with them in scope that is one build per
    # job — but mutating exegesis itself is now a sweep worth running,
    # rather than the impossibility this said before.
    "exegesis/**",
    # Fixture programs and the dashboard's TypeScript build.
    "test-programs/**",
]

exclude_re = [
    # Equivalent mutants: the arm deleted falls through to a `_` arm
    # returning the same thing, so nothing can tell the difference. The
    # arm is there to say *why* a union is stopped at.
    "delete match arm TypeClass::Union in scan_plan",
    # A constant type-name hash is a performance bug, not a behaviour
    # one, and no test can see it: the index groups candidates by this
    # hash and `rust_type_names_equal` still decides each one, so every
    # name colliding costs a comparison rather than a wrong answer.
    # Both sides of a lookup use the same function, so a sweep cannot
    # reach the thing that would really break — a hash that changes
    # between the bundle and the reader, which is what the
    # FORMAT_VERSION bump on foldhash is for.
    "replace rust_type_name_hash",
]
