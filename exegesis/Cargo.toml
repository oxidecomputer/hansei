[package]
name = "exegesis"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
# Everything only the `exegesis` binary needs, so that library consumers
# (reify/hansei) can skip the CLI stack by depending on us with
# `default-features = false`.
cli = ["dep:clap", "dep:tracing-subscriber", "dep:mimalloc"]

[[bin]]
name = "exegesis"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
foldhash.workspace = true
gimli.workspace = true
memmap2.workspace = true
object.workspace = true
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

# mimalloc's vendored C sources fail to assemble with the illumos gcc/gas
# toolchain; it is only used as the global allocator in the exegesis binary.
[target.'cfg(not(target_os = "illumos"))'.dependencies]
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
object.workspace = true
tempfile.workspace = true
