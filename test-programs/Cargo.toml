[package]
name = "test-programs"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[features]
default = ["unstable", "full-tokio"]
# The bundle-compatible recipe builds with `--cfg tokio_unstable`, which
# oxide-tokio-rt requires; the no-unstable matrix cells build with
# `--no-default-features --features full-tokio` and a plain
# `tokio::runtime::Builder` main.
unstable = ["dep:oxide-tokio-rt"]
# The tokio the ordinary cells build, split out of the dependency spec
# so a cell can build a narrower one — cargo features are additive, so
# leaving one off means never asking for it.
full-tokio = ["tokio/full", "tokio/test-util"]
# The ct-only cell's tokio: what ct-runtime touches, with rt-multi-thread
# deliberately absent, so the extraction records the multi_thread rows as
# a flavor absence. `net` is included for the io driver the runtime
# parks in.
ct-tokio = ["tokio/rt", "tokio/time", "tokio/sync", "tokio/net"]

[dependencies]
# `two-releases` links async-channel at two releases side by side, so
# one binary carries every type the two lay out differently under one
# name. Both are pinned exactly: the fixture's goldens name each
# release's layout and label, and either moving would read as a split
# that stopped happening.
async-channel = "=2.5.0"
async_channel_old = { package = "async-channel", version = "=1.9.0" }
# `http-conns` parks hyper HTTP/1 connections on both ends. hyper and
# hyper-util are pinned exactly, like tracing: the formatters navigate
# their private layouts, so a version moving under the fixture would
# show up as a red matrix cell that first has to be told apart from
# tokio drift. Both advance by hand, like the tokio floor.
bytes = "1.10.1"
futures = "0.3.32"
# http is what hyper and reqwest hand the fixture; pinned exactly like
# them, since a request line is read off its `Request` under a reviewed
# range, and the cores on hand build this release.
http = "=1.4.2"
http-body-util = "0.1.3"
hyper = { version = "=1.10.1", features = ["client", "http1", "server"] }
# `server-auto` is server + http1 + http2, so h2 is in every cell's
# build: the auto server's version-choosing state carries the HTTP/2
# connection type, and that state is what the fixture is for.
hyper-util = { version = "=0.1.20", features = [
    "client-legacy",
    "http1",
    "server",
    "server-auto",
    "tokio",
] }
oxide-tokio-rt = { version = "0.1.2", optional = true }
# `http-conns` also sends one request through reqwest, whose `send()`
# future keeps the request's method and URL: the words a request line
# is read from. Pinned exactly for the same reason as hyper; no TLS,
# no HTTP/2, no proxy discovery, since the fixture talks plain HTTP/1
# to its own listener. `cookies` is on because the programs hansei
# reads build it: it puts reqwest's cookie layer in every client's
# in-flight stack, so the fixture walks the layers they do.
reqwest = { version = "=0.13.2", default-features = false, features = ["cookies"] }
# `tls-conns` parks rustls connections through tokio-rustls. Both are
# pinned exactly, at the releases the cores on hand build, since the TLS
# session's words are read under reviewed ranges of each; they advance
# by hand, like hyper. ring is the provider, not aws-lc-rs, whose C
# build is the heavier one on the capture hosts.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = ">=1.47", default-features = false }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
# `watch-stream` parks on tokio-stream's `WatchStream` and `StreamMap`;
# the box behind a `WatchStream` is tokio-util's `ReusableBoxFuture`.
tokio-stream = { version = "0.1.14", features = ["sync"] }
tokio-util = "0.7.11"
tracing = "=0.1.40"

# For the `prctl` that lets a test harness core a fixture by pid; see
# `allow_any_tracer`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# For `thr_self`, which names the lwp `park-target` waits on.
[target.'cfg(target_os = "illumos")'.dependencies]
libc = "0.2"

[[bin]]
name = "futurelock"

# The whole graph carries full debug info (regen.sh also forces this via
# CARGO_PROFILE_RELEASE_DEBUG): tokio's own CUs hold the statics the
# extractor needs.
[profile.release]
debug = 2
