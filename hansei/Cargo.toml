[package]
name = "hansei"
version = "0.1.0"
edition = "2024"

[features]
# The on-box integration suite (tests/illumos.rs, plan §11.4). It builds
# fixture binaries, attaches to live processes, and takes cores; run it
# via tests/illumos/run.sh (or on-box with
# `cargo test -p hansei --features illumos-integration -- --ignored`).
illumos-integration = []

# The `snapshot` command, which captures the offline tests' fixtures
# rather than answering anything about a target. Off by default: it is
# a tool for producing test data, not part of what a session is for,
# and its name would otherwise take a share of the command namespace
# that prefixes resolve against. `test-programs/capture-snapshots.sh`
# turns it on.
snapshot = []

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
exegesis = { workspace = true }
hansei-types = { workspace = true }
humantime = { workspace = true }
proc = { workspace = true }
reedline = { workspace = true }
regex = { workspace = true }
reify = { workspace = true }
rustc-demangle = { workspace = true }
semver = { workspace = true }
subprocess = { workspace = true }
unwind = { workspace = true }
