[package]
name = "hansei"
version = "0.1.0"
edition = "2024"

[features]
# The `snapshot` command, which captures the offline tests' fixtures
# rather than answering anything about a target. Off by default: it is
# a tool for producing test data, not part of what a session is for,
# and its name would otherwise take a share of the command namespace
# that prefixes resolve against. `test-programs/capture-snapshots.sh`
# turns it on. It pulls in hansei-runtime's test-support module
# because the capture reads the census registry through
# `testkit::expect` — a capture is test data, so the dependency
# direction is honest.
snapshot = ["hansei-runtime/testkit"]

[dev-dependencies]
# The unit tests drive enumeration and rendering over the checked-in
# fixture pairs through testkit; the non-test code never touches it
# (outside the `snapshot` feature, which enables this itself).
hansei-runtime = { workspace = true, features = ["testkit"] }
insta = { workspace = true }
regex = { workspace = true }
# The ceiling-notice tests build `Meta.tokio_version` values; the
# non-test code only reads the ones bundles carry.
semver = { workspace = true }
tempfile = { workspace = true }
testrun = { workspace = true }

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# `hansei bundle` produces and inspects bundle files, so the DWARF stack
# reaches this bin crate — and only the arg-handling entry points in
# `bundle_cmd.rs`. Nothing a session, hansei-runtime or reify does may
# import it: if read-side code seems to need something from exegesis, it
# wants hansei-bundle.
exegesis = { workspace = true }
hansei-bundle = { workspace = true }
hansei-runtime = { workspace = true }
proc = { workspace = true }
rayon = { workspace = true }
reedline = { workspace = true }
reify = { workspace = true }
rustc-demangle = { workspace = true }
subprocess = { workspace = true }
# `RUST_LOG` selects among extraction's (and the session's) tracing
# events; with no subscriber installed they go nowhere.
tracing-subscriber = { workspace = true }
unwind = { workspace = true }

# mimalloc's vendored C sources fail to assemble with the illumos
# gcc/gas toolchain, so it is the global allocator everywhere else only.
[target.'cfg(not(target_os = "illumos"))'.dependencies]
mimalloc = { workspace = true }
