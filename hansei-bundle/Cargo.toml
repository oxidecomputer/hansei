[package]
name = "hansei-bundle"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3.workspace = true
foldhash.workspace = true
postcard.workspace = true
rustc-demangle.workspace = true
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
thiserror.workspace = true
zstd.workspace = true

# zstd-sys's vendored C fails to assemble with the illumos gcc/gas toolchain
# (Sun-syntax cmov mnemonics); helios ships libzstd + pkg-config, so link the
# system library there. Enabling the feature on this target-specific dep flips
# zstd-sys's build.rs for the whole graph, but only when compiling for illumos.
[target.'cfg(target_os = "illumos")'.dependencies]
zstd-sys = { workspace = true, features = ["pkg-config"] }

[dev-dependencies]
tempfile.workspace = true
