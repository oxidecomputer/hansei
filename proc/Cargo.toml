[package]
name = "proc"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
gimli = { workspace = true }
# The core readers parse a file and call no operating system, so they
# build wherever the crate does.
goblin = { workspace = true }
memmap2 = { workspace = true }
postcard = { workspace = true }
scroll = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "illumos")'.dependencies]
libproc-sys = { workspace = true }
# zstd-sys's vendored C fails to assemble with the illumos gcc/gas
# toolchain (Sun-syntax cmov mnemonics); link the system libzstd via
# pkg-config instead, as exegesis already does.
zstd-sys = { workspace = true, features = ["pkg-config"] }
