[package]
name = "proc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core-dump targets: memory, threads and symbols from illumos and Linux cores"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
testrun = { workspace = true }

[dependencies]
gimli = { workspace = true }
# The core readers parse a file and call no operating system, so they
# build wherever the crate does.
goblin = { workspace = true }
memmap2 = { workspace = true }
postcard = { workspace = true }
scroll = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# The libproc-backed reference reader lives inside the on-box test
# target, so only test builds bind libproc — building the library needs
# neither bindgen nor libproc, on illumos included.
[target.'cfg(target_os = "illumos")'.dev-dependencies]
libproc-sys = { workspace = true }
