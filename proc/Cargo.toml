[package]
name = "proc"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
gimli = { workspace = true }
postcard = { workspace = true }
scroll = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
goblin = { workspace = true }
memmap2 = { workspace = true }

# The real-core suite works out for itself which of a core's regions
# carry bytes, so that it checks the reader against the file rather than
# against the reader.
[target.'cfg(target_os = "linux")'.dev-dependencies]
goblin = { workspace = true }

[target.'cfg(target_os = "illumos")'.dependencies]
libproc-sys = { workspace = true }
# zstd-sys's vendored C fails to assemble with the illumos gcc/gas
# toolchain (Sun-syntax cmov mnemonics); link the system libzstd via
# pkg-config instead, as exegesis already does.
zstd-sys = { workspace = true, features = ["pkg-config"] }
