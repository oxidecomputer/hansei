# The workspace builds with the fixtures' primary toolchain
# (test-programs/matrix.toml), so hansei and the programs it is tested
# against come from one compiler. Advancing one means advancing both in
# the same commit; a testrun test fails while they differ.
#
# The minimal profile and the two components the lint job runs: a CI
# host installs this toolchain fresh on every run, and the default
# profile adds only documentation, which nothing here reads.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
